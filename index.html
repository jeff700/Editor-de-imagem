<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: sans-serif; text-align: center; background: #f4f4f4; padding: 10px; margin: 0; }
        #editor-container { position: relative; display: inline-block; border: 2px dashed #ccc; background: #fff; margin-top: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        canvas { display: block; cursor: crosshair; }
        .controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 10px; align-items: center; }
        button, input[type="file"], input[type="text"] { padding: 8px 12px; cursor: pointer; border-radius: 4px; border: 1px solid #ccc; background: #fff; font-weight: bold; font-family: inherit; }
        button:hover { background: #e0e0e0; }
        .btn-action { background-color: #007bff; color: white; border: none; }
        .btn-action:hover { background-color: #0056b3; }
        .btn-success { background-color: #28a745; color: white; border: none; }
        .btn-success:hover { background-color: #218838; }
        .input-group { display: inline-flex; align-items: center; gap: 4px; background: #fff; padding: 2px 6px; border: 1px solid #ccc; border-radius: 4px; }
        .input-group input { border: none; outline: none; padding: 4px; }
    </style>
</head>
<body>

    <h3>Editor de Imagem e Anotações</h3>
    <input type="file" id="uploadImage" accept="image/*">
    
    <div class="controls">
        <button class="btn-action" onclick="addText()">Adicionar Texto</button>
        <button class="btn-action" onclick="addRect()">Adicionar Retângulo</button>
        <button onclick="clearCanvas()" style="background-color: #ff4757; color: white; border: none;">Limpar Tudo</button>
        
        <div class="input-group">
            <span style="font-size: 12px; color: #666;">Salvar como:</span>
            <input type="text" id="fileNameInput" value="imagem-editada">
        </div>
        <button class="btn-success" onclick="saveImage()">Salvar Imagem</button>
    </div>

    <div id="editor-container">
        <canvas id="canvas" width="600" height="400"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        let loadedImage = null;
        let elements = [];

        document.getElementById('uploadImage').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const originalName = file.name.substring(0, file.name.lastIndexOf('.')) || file.name;
            document.getElementById('fileNameInput').value = originalName + '-editado';

            // Utiliza ObjectURL para contornar bloqueios do iframe e carregar instantaneamente
            const objectURL = URL.createObjectURL(file);
            const img = new Image();
            
            img.onload = function() {
                loadedImage = img;
                redrawCanvas();
                URL.revokeObjectURL(objectURL); // Libera memória
            }
            img.src = objectURL;
        });

        function redrawCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if (loadedImage) {
                const hRatio = canvas.width / loadedImage.width;
                const vRatio = canvas.height / loadedImage.height;
                const ratio = Math.min(hRatio, vRatio);
                const centerShiftX = (canvas.width - loadedImage.width * ratio) / 2;
                const centerShiftY = (canvas.height - loadedImage.height * ratio) / 2;
                
                ctx.drawImage(loadedImage, 0, 0, loadedImage.width, loadedImage.height, centerShiftX, centerShiftY, loadedImage.width * ratio, loadedImage.height * ratio);
            }

            elements.forEach(el => {
                ctx.save();
                if (el.type === 'text') {
                    ctx.font = el.font;
                    ctx.fillStyle = el.color;
                    ctx.fillText(el.text, el.x, el.y);
                } else if (el.type === 'rect') {
                    ctx.strokeStyle = el.stroke;
                    ctx.lineWidth = el.lineWidth;
                    ctx.strokeRect(el.x, el.y, el.width, el.height);
                }
                ctx.restore();
            });
        }

        function addText() {
            elements.push({
                type: 'text',
                text: 'Texto de Exemplo',
                x: 100,
                y: 100,
                font: '20px Arial',
                color: 'red'
            });
            redrawCanvas();
        }

        function addRect() {
            elements.push({
                type: 'rect',
                x: 150,
                y: 150,
                width: 150,
                height: 100,
                stroke: 'blue',
                lineWidth: 3
            });
            redrawCanvas();
        }

        function clearCanvas() {
            elements = [];
            loadedImage = null;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            document.getElementById('uploadImage').value = '';
        }

        function saveImage() {
            let customName = document.getElementById('fileNameInput').value.trim();
            if (!customName) {
                customName = 'imagem-editada';
            }

            const dataURL = canvas.toDataURL('image/png');
            const link = document.createElement('a');
            link.download = customName + '.png';
            link.href = dataURL;
            link.target = '_blank';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>

</body>
</html>
